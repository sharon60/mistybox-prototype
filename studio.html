<title>MistyBox Box Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed WebGL stage, one floating control dock along the bottom edge. Single dark showroom look. */
:root{
  --bg:#06070a; --panel:rgba(18,20,26,.78); --line:rgba(255,255,255,.10); --fg:#eef1f6; --muted:#8d94a3;
  --ice:#bfe6ff; --red:#ff2b3a;
  --display:'Chakra Petch', 'Inter', system-ui, sans-serif; --body:'Inter', system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;pointer-events:none}
.brand{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.brand b{color:var(--ice);font-weight:600}
.hint{color:var(--muted);font-size:12px;text-align:right}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(720px, calc(100% - 2*max(16px,env(safe-area-inset-left,0px))));
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:7px;font:500 13px var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--fg)}
.btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;
  background:linear-gradient(180deg,#f4f7fb,#c9d0da);color:#0b0d12}
.btn:active{transform:translateY(1px)}
.tog{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.tog i{width:30px;height:18px;border-radius:9px;background:rgba(255,255,255,.12);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .2s}
.tog[aria-pressed="true"]{color:var(--fg)}
.tog[aria-pressed="true"] i{background:#3a7bd5}
.tog[aria-pressed="true"] i::after{transform:translateX(12px)}
.lid{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.lid label{font-size:12px;color:var(--muted);white-space:nowrap}
.lid output{font:500 12px var(--body);font-variant-numeric:tabular-nums;color:var(--fg);width:3.2em;text-align:right}
input[type=range]{flex:1;min-width:0;accent-color:var(--ice)}
.seg button:focus-visible,.btn:focus-visible,.tog:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
[hidden]{display:none!important}
#load{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font:500 13px var(--body);pointer-events:none}
@media (max-width:520px){.hint{display:none}.dock{padding:10px}}
</style>

<canvas id="stage" aria-label="Interactive 3D MistyBox box. Drag to rotate, scroll or pinch to zoom."></canvas>
<div class="top"><div class="brand">Misty<b>Box</b> · Box Studio</div><div class="hint">Drag to rotate · Scroll or pinch to zoom · Double-click to open</div></div>
<div id="load">Loading the box…</div>
<div class="dock" role="group" aria-label="Box controls">
  <div class="row">
    <div class="seg" role="group" aria-label="Skin">
      <button id="skinAgent" aria-pressed="true">The Agent</button>
      <button id="skinCarbon" aria-pressed="false">Carbon</button>
    </div>
    <button class="btn" id="openBtn">Open</button>
    <button class="tog" id="spinTog" aria-pressed="true"><i></i>Auto-rotate</button>
    <button class="tog" id="glowTog" aria-pressed="true"><i></i>Glow</button>
  </div>
  <div class="row"><div class="lid"><label for="lidRange">Lid</label><input id="lidRange" type="range" min="0" max="105" value="0" step="1"><output id="lidOut">0°</output></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const canvas = document.getElementById('stage');
const R = new THREE.WebGLRenderer({canvas, antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.0; R.outputColorSpace = THREE.SRGBColorSpace;
const S = new THREE.Scene(); S.background = new THREE.Color('#06070a');
const pm = new THREE.PMREMGenerator(R);
// dark studio environment: black room with a few softboxes, so gloss and chrome reflect strips of light, not a white room
function studioEnv(){
  const env = new THREE.Scene(); env.background = new THREE.Color(0x050506);
  const box = (w,h,x,y,z,ry,rx,int)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(int,int,int),side:THREE.DoubleSide}));
    m.position.set(x,y,z);m.lookAt(0,.5,0);env.add(m)};
  box(6,3,-5,6,4,0,0,3.2);      // big key softbox above-left-front
  box(1.2,7,6,2.5,-3,0,0,2.4);  // tall strip behind-right (edges)
  box(1.2,7,-6.5,2,-1,0,0,1.6); // tall strip left
  box(5,1,0,1.2,7,0,0,1.0);     // low front card (sheen on the panels)
  box(8,8,0,9,0,0,0,.35);       // faint ceiling
  return pm.fromScene(env, 0).texture }
S.environment = studioEnv(); S.environmentIntensity = 1.0;
const cam = new THREE.PerspectiveCamera(32, 1, .05, 50); cam.position.set(-2.2, 2.0, 4.6);
const ctl = new OrbitControls(cam, canvas); ctl.target.set(0, .52, 0); ctl.enableDamping = true; ctl.dampingFactor = .07;
ctl.minDistance = 2.2; ctl.maxDistance = 9; ctl.maxPolarAngle = Math.PI * .56; ctl.autoRotate = true; ctl.autoRotateSpeed = .9;

// lights: key above-left, cool rim behind-right, low red bounce
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(-3, 5, 3); S.add(key);
const rim = new THREE.DirectionalLight(0xbfdfff, 1.6); rim.position.set(3.5, 2, -3.5); S.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, .5); fill.position.set(2, 1, 4); S.add(fill);

// floor: soft contact shadow + faint glow ring
function radial(stops){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const r=g.createRadialGradient(128,128,0,128,128,128);stops.forEach(([o,col])=>r.addColorStop(o,col));g.fillStyle=r;g.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.6), new THREE.MeshBasicMaterial({map:radial([[0,'rgba(0,0,0,.85)'],[.55,'rgba(0,0,0,.35)'],[1,'rgba(0,0,0,0)']]),transparent:true,depthWrite:false}));
shadow.rotation.x = -Math.PI/2; shadow.position.y = .001; S.add(shadow);
const halo = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 5.5), new THREE.MeshBasicMaterial({map:radial([[0,'rgba(120,170,255,.10)'],[.5,'rgba(120,170,255,.03)'],[1,'rgba(0,0,0,0)']]),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
halo.rotation.x = -Math.PI/2; halo.position.y = .0005; S.add(halo);

// procedural textures
function brushTex(){const c=document.createElement('canvas');c.width=512;c.height=64;const g=c.getContext('2d');
  g.fillStyle='#8a8a8a';g.fillRect(0,0,512,64);
  for(let i=0;i<900;i++){const y=Math.random()*64,v=110+Math.random()*60|0;g.fillStyle=`rgba(${v},${v},${v},.35)`;g.fillRect(0,y,512,Math.random()*1.2+.3)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,12);return t}
function twill(){const N=8,P=32,c=document.createElement('canvas');c.width=c.height=N*P;const g=c.getContext('2d');
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const horiz=((i+j)%4)<2,x=i*P,y=j*P;
    const gr=horiz?g.createLinearGradient(0,y,0,y+P):g.createLinearGradient(x,0,x+P,0);
    const hi=horiz?'#2a2c31':'#16171a';gr.addColorStop(0,'#050506');gr.addColorStop(.5,hi);gr.addColorStop(1,'#050506');
    g.fillStyle=gr;g.fillRect(x,y,P,P)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.repeat.set(13.5,13.5);return t}
const BRUSH = brushTex(), TWILL = twill();

const MATS = {
  PianoBlack: () => new THREE.MeshPhysicalMaterial({color:0x040405,roughness:.14,clearcoat:1,clearcoatRoughness:.03,metalness:0}),
  CarbonTwill: () => new THREE.MeshPhysicalMaterial({map:TWILL,color:0xffffff,roughness:.32,clearcoat:.6,clearcoatRoughness:.08}),
  ChromeV: () => new THREE.MeshStandardMaterial({color:0xdfe3ea,metalness:1,roughness:.14,roughnessMap:BRUSH}),
  ChromeH: () => new THREE.MeshStandardMaterial({color:0xdfe3ea,metalness:1,roughness:.14,roughnessMap:BRUSH}),
  ChromeRail: () => new THREE.MeshStandardMaterial({color:0xeef1f6,metalness:1,roughness:.1}),
  MetalBrushedV: () => new THREE.MeshStandardMaterial({color:0x6b6e75,metalness:1,roughness:.26,roughnessMap:BRUSH}),
  MetalBrushedH: () => new THREE.MeshStandardMaterial({color:0x6b6e75,metalness:1,roughness:.26,roughnessMap:BRUSH}),
  MetalRail: () => new THREE.MeshStandardMaterial({color:0xb9bec7,metalness:1,roughness:.2}),
  LedWhite: () => new THREE.MeshStandardMaterial({color:0x000000,emissive:0xffffff,emissiveIntensity:2.2}),
  LedIce: () => new THREE.MeshStandardMaterial({color:0x000000,emissive:0xdff1ff,emissiveIntensity:2.2}),
  LedRed: () => new THREE.MeshStandardMaterial({color:0x000000,emissive:0xff1a26,emissiveIntensity:5}),
  InteriorMatte: () => new THREE.MeshStandardMaterial({color:0x0b0b0c,roughness:.95}),
  HingeSteel: () => new THREE.MeshStandardMaterial({color:0x8a8e96,metalness:1,roughness:.3}),
};

function b64ToBuf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
const loader = new GLTFLoader();
const models = {}; let current = null, hinge = null;
function load(name){return new Promise((res,rej)=>loader.parse(b64ToBuf(window.GLB[name]),'',g=>{
  const root=g.scene; const cache={};
  root.traverse(o=>{if(o.isMesh){const n=o.material.name;if(MATS[n]){cache[n]??=MATS[n]();o.material=cache[n]}}});
  // centre on the floor
  const box=new THREE.Box3().setFromObject(root);root.position.y-=box.min.y;root.position.x-=(box.min.x+box.max.x)/2;root.position.z-=(box.min.z+box.max.z)/2;
  res(root)},rej))}

// red glow lights at the seam corners (moved with the skin)
const redLights = [];
function addRedLights(root){redLights.forEach(l=>l.parent&&l.parent.remove(l));redLights.length=0;
  const box=new THREE.Box3().setFromObject(root),y=box.min.y+(box.max.y-box.min.y)*.79;
  for(const sx of[-1,1])for(const sz of[-1,1]){const l=new THREE.PointLight(0xff2030,.6,.6,2);l.position.set(sx*(box.max.x-.02),y,sz*(box.max.z-.02));S.add(l);redLights.push(l)}}

let angle = 0, target = 0;
function setSkin(name){
  if(current) S.remove(current);
  current = models[name]; S.add(current); hinge = current.getObjectByName('LidHinge');
  addRedLights(current); applyLid();
  document.getElementById('skinAgent').setAttribute('aria-pressed', name==='agent');
  document.getElementById('skinCarbon').setAttribute('aria-pressed', name==='carbon');
  try{localStorage.setItem('mb-box-skin',name)}catch(e){}
}
function applyLid(){ if(hinge) hinge.rotation.x = -THREE.MathUtils.degToRad(angle);
  document.getElementById('lidRange').value = Math.round(angle); document.getElementById('lidOut').textContent = Math.round(angle)+'°';
  document.getElementById('openBtn').textContent = target > 50 || angle > 52 ? 'Close' : 'Open'; }

// post: bloom
const comp = new EffectComposer(R); comp.addPass(new RenderPass(S, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(1,1), .42, .28, 1.0); comp.addPass(bloom); comp.addPass(new OutputPass());
let glow = true;

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);comp.setSize(w,h);cam.aspect=w/h;
  cam.fov = w < h ? 44 : 32; cam.updateProjectionMatrix()}
addEventListener('resize', resize); resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){ctl.autoRotate=false;document.getElementById('spinTog').setAttribute('aria-pressed','false')}
let animating=false;
function toggleOpen(){ target = (angle > 52 || target > 52) ? 0 : 105; animating = true; }
document.getElementById('openBtn').onclick = toggleOpen;
canvas.addEventListener('dblclick', toggleOpen);
document.getElementById('lidRange').oninput = e => { animating=false; angle = target = +e.target.value; applyLid(); };
document.getElementById('skinAgent').onclick = () => setSkin('agent');
document.getElementById('skinCarbon').onclick = () => setSkin('carbon');
document.getElementById('spinTog').onclick = e => { ctl.autoRotate = !ctl.autoRotate; e.currentTarget.setAttribute('aria-pressed', ctl.autoRotate); };
document.getElementById('glowTog').onclick = e => { glow = !glow; e.currentTarget.setAttribute('aria-pressed', glow); };
ctl.addEventListener('start', () => { if(ctl.autoRotate){ ctl.autoRotate=false; document.getElementById('spinTog').setAttribute('aria-pressed','false'); } });

const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  if(animating){ const d = target - angle; const step = Math.sign(d) * Math.max(8, Math.abs(d) * 3.2) * dt;
    if(Math.abs(d) <= Math.abs(step)){ angle = target; animating=false } else angle += step; applyLid(); }
  const t = clock.elapsedTime; redLights.forEach((l,i)=> l.intensity = .5 + .15*Math.sin(t*2 + i));
  ctl.update();
  if(glow) comp.render(); else R.render(S, cam);
  requestAnimationFrame(frame);
}

Promise.all([load('agent'), load('carbon')]).then(([a, c]) => {
  models.agent = a; models.carbon = c;
  let start = 'agent'; try{ const v = localStorage.getItem('mb-box-skin'); if(v === 'carbon') start = v }catch(e){}
  setSkin(start); document.getElementById('load').hidden = true; frame();
}).catch(err => { document.getElementById('load').textContent = 'The 3D model could not load: ' + err.message; });
</script>

</body></html>
